# agentibrain-kernel — root compose for local non-k8s deployment.
#
# Quickstart:
#   ./local/bootstrap.sh   # generates .env + scaffolds ~/agentibrain-vault
#   docker compose up -d
#
# Optional Ollama overlay for local AI tick:
#   docker compose -f compose.yml -f local/compose.ollama.yml up -d
#
# See local/README.md for full docs (inference modes, troubleshooting, etc.).

x-agentibrain-tuning: &agentibrain-tuning
  AMYGDALA_CLEAR_WINDOW: ${AMYGDALA_CLEAR_WINDOW:-900}
  BRAIN_FEEDBACK_LOOKBACK: ${BRAIN_FEEDBACK_LOOKBACK:-6}
  BRAIN_HOT_ARC_BLURB_CHARS: ${BRAIN_HOT_ARC_BLURB_CHARS:-220}
  BRAIN_SYNTH_IGNITION_CHARS: ${BRAIN_SYNTH_IGNITION_CHARS:-240}
  BRAIN_SYNTH_MARKER_CHARS: ${BRAIN_SYNTH_MARKER_CHARS:-200}
  BRAIN_VERIFIER_ENABLED: ${BRAIN_VERIFIER_ENABLED:-true}
  FEED_CACHE_TTL_SECONDS: ${FEED_CACHE_TTL_SECONDS:-30}
  IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-3600}
  KB_RRF_K: ${KB_RRF_K:-60}
  MAX_FILE_BYTES: ${MAX_FILE_BYTES:-5242880}
  OUTBOX_DRAIN_MAX_SECONDS: ${OUTBOX_DRAIN_MAX_SECONDS:-600}
  PIPELINE_AI_PHASE_LAG_HOURS: ${PIPELINE_AI_PHASE_LAG_HOURS:-24}
  PIPELINE_MAX_SCAN: ${PIPELINE_MAX_SCAN:-5000}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentibrain_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain}
      POSTGRES_DB: ${POSTGRES_DB:-brain}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./local/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PORT_POSTGRES:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brain} -d ${POSTGRES_DB:-brain}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: agentibrain_redis
    restart: unless-stopped
    # Agent sessions and test runs on this host share the port; no client may wipe the swarm and inbox state.
    command: ["bash", "/compose/redis/start.sh"]
    env_file:
      - path: ${SWARM_REDIS_ENV_FILE:-${HOME}/.agentihooks/swarm-stack/.env}
        required: false
    volumes:
      - redis-data:/data
      - ./local/redis:/compose/redis:ro
    ports:
      - "127.0.0.1:${PORT_REDIS:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  embeddings:
    build:
      context: ./services/embeddings
      dockerfile: Dockerfile
    image: ghcr.io/the-cloud-clockwork/agentibrain-embeddings:local
    container_name: agentibrain_embeddings
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *agentibrain-tuning
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://brain:brain@postgres:5432/brain}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-text-embedding-3-small}
      # Pin the vector dimension when LLM_EMBED_MODEL is not a recognised
      # family; required for unknown models (the service refuses to guess).
      EMBED_DIM: ${EMBED_DIM:-}
      # Opt in to dropping existing embeddings when the model dimension
      # changes. Off by default — a mismatch is reported, not silently wiped.
      EMBED_DIM_FORCE_MIGRATE: ${EMBED_DIM_FORCE_MIGRATE:-}
      API_KEYS: ${EMBEDDINGS_API_KEYS:-}
      AUTH_MODE: ${AUTH_MODE:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${PORT_EMBEDDINGS:-8102}:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  brain-api:
    build:
      context: ./services/brain-api
      dockerfile: Dockerfile
    image: ghcr.io/the-cloud-clockwork/agentibrain-brain-api:local
    container_name: agentibrain_brain_api
    restart: unless-stopped
    depends_on:
      embeddings:
        condition: service_healthy
    environment:
      <<: *agentibrain-tuning
      EMBEDDINGS_URL: http://embeddings:8080
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      KB_ROUTER_TOKEN: ${KB_ROUTER_TOKEN:-}
      INFERENCE_URL: ${INFERENCE_URL:-}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      BRAIN_CLASSIFY_MODEL: ${BRAIN_CLASSIFY_MODEL:-brain-classify}
      VAULT_ROOT: /vault
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # /health/pipeline thresholds. Defaults track the cadences below:
      # tick-drain polls every TICK_DRAIN_INTERVAL_SECONDS (30s), tick-cron
      # fires every TICK_INTERVAL_SECONDS (2h). Raise these on a deployment
      # that ticks less often, or the report warns about a healthy stack.
      PIPELINE_PENDING_STUCK_SECONDS: ${PIPELINE_PENDING_STUCK_SECONDS:-300}
      PIPELINE_TICK_STALE_HOURS: ${PIPELINE_TICK_STALE_HOURS:-6}
      PIPELINE_FEED_STALE_HOURS: ${PIPELINE_FEED_STALE_HOURS:-6}
      PIPELINE_MARKER_QUIET_HOURS: ${PIPELINE_MARKER_QUIET_HOURS:-72}
      # Newest-first cap on the signal dedup scan performed per marker
      # write. Bounds the cost against a directory that would otherwise
      # grow without limit.
      SIGNAL_DEDUP_SCAN_MAX: ${SIGNAL_DEDUP_SCAN_MAX:-300}
      # Shared with brain-ops: the pipeline check reads the same lesson-feed
      # cap and window the tick writes with, so a mismatch reads as a defect.
      BRAIN_LESSON_FEED_MAX: ${BRAIN_LESSON_FEED_MAX:-6}
      BRAIN_STALE_LESSON_DAYS: ${BRAIN_STALE_LESSON_DAYS:-14}
    volumes:
      - ${VAULT_ROOT_HOST:-~/agentibrain-vault}:/vault
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT_BRAIN_API:-8103}:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tick-cron:
    build:
      context: ./services/brain-ops
      dockerfile: Dockerfile
    image: ghcr.io/the-cloud-clockwork/agentibrain-brain-ops:local
    container_name: agentibrain_tick_cron
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      brain-api:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        INTERVAL="$${TICK_INTERVAL_SECONDS:-7200}"
        echo "[tick-cron] starting; interval=$${INTERVAL}s"
        PROJECTS_DIR="$${EXTRACT_PROJECTS_DIR:-/shared/.claude/projects}"
        # Normalise a single-digit hour ("4" → "04") to match `date -u +%H`.
        GATE_HOUR="$${EXTRACT_HOUR:-04}"
        case "$${GATE_HOUR}" in
          [0-9]) GATE_HOUR="0$${GATE_HOUR}" ;;
        esac
        # Docker auto-creates a missing bind-mount source, so `-d` alone is
        # always true — an empty dir is the real "nothing mounted" signal.
        have_transcripts() {
          [ -d "$${PROJECTS_DIR}" ] && [ -n "$$(ls -A "$${PROJECTS_DIR}" 2>/dev/null)" ]
        }
        run_extraction() {
          ex_since="$$1"
          ex_outdir="/vault/clusters/$$(date -u +%Y-%m-%d)"
          mkdir -p "$${ex_outdir}" 2>/dev/null || true
          echo "[tick-cron] extraction: since=$${ex_since} min-turns=$${EXTRACT_MIN_TURNS:-5}"
          python3 /app/extract.py --since "$${ex_since}" \
            --min-turns "$${EXTRACT_MIN_TURNS:-5}" \
            --projects-dir "$${PROJECTS_DIR}" \
            --codex-dir "$${EXTRACT_CODEX_DIR:-/shared/.codex/sessions}" \
            | python3 /app/cluster.py --out-dir "$${ex_outdir}" \
            || echo "[tick-cron] extraction failed (continuing)"
        }
        # One-shot seed pass at container start (historical backfill).
        if [ "$${EXTRACT_ON_BOOT:-0}" = "1" ]; then
          if have_transcripts; then
            run_extraction "$${EXTRACT_BOOT_SINCE:-90d}"
          else
            echo "[tick-cron] EXTRACT_ON_BOOT=1 but $${PROJECTS_DIR} is empty or not mounted — skipping seed"
          fi
        fi
        while true; do
          DATE=$$(date -u +%Y-%m-%d)
          HOUR=$$(date -u +%H)
          OUTDIR="/vault/clusters/$${DATE}"
          mkdir -p "$${OUTDIR}" 2>/dev/null || true

          # Extraction: once daily at EXTRACT_HOUR UTC
          if [ "$${HOUR}" = "$${GATE_HOUR}" ] && have_transcripts; then
            run_extraction "$${EXTRACT_SINCE:-26h}"
          fi

          # Drain agentihooks marker buffers (outbox + -backlog) over HTTP.
          # Replaces host crons: compose owns the schedule when compose runs
          # the brain. No-op when the mount is empty or absent.
          if [ -n "$${KB_ROUTER_TOKEN}" ] && [ -d /agentihooks/brain-outbox ]; then
            python3 /app/outbox_drain.py --outbox /agentihooks/brain-outbox \
              || echo "[tick-cron] outbox_drain failed (non-fatal)"
          fi

          python3 /app/tick_cycle.py scheduled --vault /vault \
            || echo "[tick-cron] tick cycle failed; the failed phase is logged above"

          echo "[tick-cron] sleeping $${INTERVAL}s until next tick"
          sleep "$${INTERVAL}"
        done
    environment:
      <<: *agentibrain-tuning
      TICK_CYCLE_MODE: vault
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/11}
      INFERENCE_URL: ${INFERENCE_URL:-}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      BRAIN_BRIEF_MODEL: ${BRAIN_BRIEF_MODEL:-brain-brief}
      EMBEDDINGS_URL: http://embeddings:8080
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      BRAIN_DECAY_START_DAYS: ${BRAIN_DECAY_START_DAYS:-2}
      BRAIN_DECAY_INTERVAL_DAYS: ${BRAIN_DECAY_INTERVAL_DAYS:-2}
      BRAIN_STALE_SIGNAL_DAYS: ${BRAIN_STALE_SIGNAL_DAYS:-3}
      BRAIN_STALE_INJECT_DAYS: ${BRAIN_STALE_INJECT_DAYS:-30}
      BRAIN_STALE_CRITICAL_DAYS: ${BRAIN_STALE_CRITICAL_DAYS:-5}
      BRAIN_STALE_LESSON_DAYS: ${BRAIN_STALE_LESSON_DAYS:-14}
      BRAIN_LESSON_MIN_CHARS: ${BRAIN_LESSON_MIN_CHARS:-40}
      BRAIN_TICK_COMPLETED_RETAIN_DAYS: ${BRAIN_TICK_COMPLETED_RETAIN_DAYS:-7}
      BRAIN_TICK_FAILED_RETAIN_DAYS: ${BRAIN_TICK_FAILED_RETAIN_DAYS:-30}
      BRAIN_TICK_QUEUE_KEEP_MIN: ${BRAIN_TICK_QUEUE_KEEP_MIN:-20}
      # amygdala/ retention. Signal files are archived under _backups/,
      # never deleted — a signal records what caught fire and often what
      # was done about it. A closed incident becomes history sooner than
      # an open one. 0 on either disables that half of the sweep.
      BRAIN_SIGNAL_RETAIN_DAYS: ${BRAIN_SIGNAL_RETAIN_DAYS:-90}
      BRAIN_SIGNAL_RESOLVED_RETAIN_DAYS: ${BRAIN_SIGNAL_RESOLVED_RETAIN_DAYS:-14}
      BRAIN_SIGNAL_KEEP_MIN: ${BRAIN_SIGNAL_KEEP_MIN:-25}
      # Deadline for the AI synthesis call. 120s suits a hosted frontier
      # model; a local 7B needs several times that for a full-vault prompt.
      BRAIN_LLM_TIMEOUT_SECONDS: ${BRAIN_LLM_TIMEOUT_SECONDS:-600}
      BRAIN_PROMPT_MAX_CHARS: ${BRAIN_PROMPT_MAX_CHARS:-12000}
      BRAIN_LLM_MAX_TOKENS: ${BRAIN_LLM_MAX_TOKENS:-512}
      BRAIN_LESSON_FEED_MAX: ${BRAIN_LESSON_FEED_MAX:-6}
      # Heat thresholds govern which arcs sit in frontal-lobe/conscious. Unset
      # here they fell through to the code defaults (promote 5 / demote 3),
      # which are stricter than a long-lived deployment usually wants — the
      # demotion branch tests `heat < max(DEMOTE, PROMOTE)`, so a higher
      # PROMOTE_HEAT silently evicts arcs from conscious/ on the next tick.
      # Surfaced so a vault carrying its own tuning can restore it.
      BRAIN_PROMOTE_HEAT: ${BRAIN_PROMOTE_HEAT:-5}
      BRAIN_DEMOTE_HEAT: ${BRAIN_DEMOTE_HEAT:-3}
      BRAIN_GRADUATE_HEAT: ${BRAIN_GRADUATE_HEAT:-1}
      BRAIN_GRADUATE_AGE_DAYS: ${BRAIN_GRADUATE_AGE_DAYS:-14}
      BRAIN_MAX_SYNTH_ARCS: ${BRAIN_MAX_SYNTH_ARCS:-25}
      EXTRACT_HOUR: "${EXTRACT_HOUR:-04}"
      EXTRACT_SINCE: ${EXTRACT_SINCE:-26h}
      EXTRACT_MIN_TURNS: "${EXTRACT_MIN_TURNS:-5}"
      EXTRACT_PROJECTS_DIR: /shared/.claude/projects
      EXTRACT_CODEX_DIR: /shared/.codex/sessions
      EXTRACT_ON_BOOT: "${EXTRACT_ON_BOOT:-0}"
      EXTRACT_BOOT_SINCE: ${EXTRACT_BOOT_SINCE:-90d}
      BRAIN_API_URL: http://brain-api:8080
      KB_ROUTER_TOKEN: ${KB_ROUTER_TOKEN:-}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-brain}
      CLICKHOUSE_TICK_TABLE: ${CLICKHOUSE_TICK_TABLE:-tick_health}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${VAULT_ROOT_HOST:-~/agentibrain-vault}:/vault
      - ${CLAUDE_PROJECTS_HOST:-~/.claude/projects}:/shared/.claude/projects:ro
      - ${CODEX_SESSIONS_HOST:-~/.codex/sessions}:/shared/.codex/sessions:ro
      # Marker buffers written by agentihooks sessions on this host; tick-cron
      # drains them into brain-api so no host cron is ever needed.
      - ${AGENTIHOOKS_HOME_HOST:-~/.agentihooks}:/agentihooks

  tick-drain:
    build:
      context: ./services/brain-ops
      dockerfile: Dockerfile
    image: ghcr.io/the-cloud-clockwork/agentibrain-brain-ops:local
    container_name: agentibrain_tick_drain
    restart: unless-stopped
    depends_on:
      brain-api:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        INTERVAL="$${TICK_DRAIN_INTERVAL_SECONDS:-30}"
        echo "[tick-drain] starting; interval=$${INTERVAL}s"
        while true; do
          python3 /app/tick_cycle.py drain --vault /vault \
            || echo "[tick-drain] tick cycle failed; unfinished requests stay queued for retry"
          sleep "$$INTERVAL"
        done
    environment:
      <<: *agentibrain-tuning
      INFERENCE_URL: ${INFERENCE_URL:-}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      BRAIN_BRIEF_MODEL: ${BRAIN_BRIEF_MODEL:-brain-brief}
      EMBEDDINGS_URL: http://embeddings:8080
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      # Must mirror tick-cron: a drain-triggered tick and a scheduled tick have
      # to promote/demote arcs identically, or heat oscillates between them.
      BRAIN_DECAY_START_DAYS: ${BRAIN_DECAY_START_DAYS:-2}
      BRAIN_DECAY_INTERVAL_DAYS: ${BRAIN_DECAY_INTERVAL_DAYS:-2}
      BRAIN_STALE_SIGNAL_DAYS: ${BRAIN_STALE_SIGNAL_DAYS:-3}
      BRAIN_STALE_INJECT_DAYS: ${BRAIN_STALE_INJECT_DAYS:-30}
      BRAIN_STALE_CRITICAL_DAYS: ${BRAIN_STALE_CRITICAL_DAYS:-5}
      BRAIN_STALE_LESSON_DAYS: ${BRAIN_STALE_LESSON_DAYS:-14}
      BRAIN_LESSON_MIN_CHARS: ${BRAIN_LESSON_MIN_CHARS:-40}
      BRAIN_TICK_COMPLETED_RETAIN_DAYS: ${BRAIN_TICK_COMPLETED_RETAIN_DAYS:-7}
      BRAIN_TICK_FAILED_RETAIN_DAYS: ${BRAIN_TICK_FAILED_RETAIN_DAYS:-30}
      BRAIN_TICK_QUEUE_KEEP_MIN: ${BRAIN_TICK_QUEUE_KEEP_MIN:-20}
      # amygdala/ retention. Signal files are archived under _backups/,
      # never deleted — a signal records what caught fire and often what
      # was done about it. A closed incident becomes history sooner than
      # an open one. 0 on either disables that half of the sweep.
      BRAIN_SIGNAL_RETAIN_DAYS: ${BRAIN_SIGNAL_RETAIN_DAYS:-90}
      BRAIN_SIGNAL_RESOLVED_RETAIN_DAYS: ${BRAIN_SIGNAL_RESOLVED_RETAIN_DAYS:-14}
      BRAIN_SIGNAL_KEEP_MIN: ${BRAIN_SIGNAL_KEEP_MIN:-25}
      # Deadline for the AI synthesis call. 120s suits a hosted frontier
      # model; a local 7B needs several times that for a full-vault prompt.
      BRAIN_LLM_TIMEOUT_SECONDS: ${BRAIN_LLM_TIMEOUT_SECONDS:-600}
      BRAIN_PROMPT_MAX_CHARS: ${BRAIN_PROMPT_MAX_CHARS:-12000}
      BRAIN_LLM_MAX_TOKENS: ${BRAIN_LLM_MAX_TOKENS:-512}
      BRAIN_LESSON_FEED_MAX: ${BRAIN_LESSON_FEED_MAX:-6}
      # Same reason these must mirror tick-cron: a drain-triggered tick that
      # promoted/demoted on different thresholds would fight the scheduled one.
      BRAIN_PROMOTE_HEAT: ${BRAIN_PROMOTE_HEAT:-5}
      BRAIN_DEMOTE_HEAT: ${BRAIN_DEMOTE_HEAT:-3}
      BRAIN_GRADUATE_HEAT: ${BRAIN_GRADUATE_HEAT:-1}
      BRAIN_GRADUATE_AGE_DAYS: ${BRAIN_GRADUATE_AGE_DAYS:-14}
      BRAIN_MAX_SYNTH_ARCS: ${BRAIN_MAX_SYNTH_ARCS:-25}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-brain}
      CLICKHOUSE_TICK_TABLE: ${CLICKHOUSE_TICK_TABLE:-tick_health}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${VAULT_ROOT_HOST:-~/agentibrain-vault}:/vault

  amygdala:
    build:
      context: ./services/brain-ops
      dockerfile: Dockerfile
    image: ghcr.io/the-cloud-clockwork/agentibrain-brain-ops:local
    container_name: agentibrain_amygdala
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # The DB override lives in amygdala.py (--db / AMYGDALA_DB), not in a shell
    # rewrite here: `${URL%/*}/11` turns a legal `redis://host:6379` into
    # `redis://11` and connects to a host named "11".
    command:
      - /app/amygdala.py
      - --continuous
      - --poll-interval
      - "5"
      - --vault
      - /vault
      - --brain-feed
      - /vault/brain-feed
    environment:
      <<: *agentibrain-tuning
      # Interpolated from the host env / .env, then DB-corrected in the command
      # above. Without this line the container has no REDIS_URL at all and the
      # shell falls through to the in-stack default, which is how a bus pointed
      # at another host silently becomes a bus pointed at localhost.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/11}
      AMYGDALA_DB: ${AMYGDALA_DB:-11}
      AMYGDALA_STREAMS: ${AMYGDALA_STREAMS:-events:health,events:host,events:deploy,events:system,events:brain}
      AMYGDALA_CONSUMER: ${AMYGDALA_CONSUMER:-amygdala-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${VAULT_ROOT_HOST:-~/agentibrain-vault}:/vault

  mcp:
    build:
      context: ./services/mcp
      dockerfile: Dockerfile
    image: ghcr.io/the-cloud-clockwork/agentibrain-mcp:local
    container_name: agentibrain_mcp
    restart: unless-stopped
    depends_on:
      brain-api:
        condition: service_healthy
    environment:
      <<: *agentibrain-tuning
      INFERENCE_URL: ${INFERENCE_URL:-}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      BRAIN_BRIEF_MODEL: ${BRAIN_BRIEF_MODEL:-brain-brief}
      BRAIN_API_URL: http://brain-api:8080
      KB_ROUTER_TOKEN: ${KB_ROUTER_TOKEN:-}
      EMBEDDINGS_URL: http://embeddings:8080
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      MCP_AUTH_MODE: local
      MCP_PROXY_API_KEY: ""
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${PORT_MCP:-8104}:8080"

volumes:
  pg-data:
  redis-data:
