# -- agentihooks fields (read by install.py) --
name: brain
description: "Brain Usage Instructions — required brain tool routing, durable ingestion, marker emission, and channel discipline. Chain this profile to give any agent shared memory."
mcp_categories: []
enabledMcpServers: []

# This profile is meant to be CHAINED, not used standalone.
# Example: AGENTIHOOKS_PROFILE=<base-profile>,brain
# or: AGENTIHOOKS_PROFILE=agenticore,brain
#
# It adds:
#   1. Required brain tool routing for reads, durable writes, and ticks
#   2. Rules for marker emission (what to emit, when, severity levels)
#   3. Brain and amygdala channel discipline
#   4. A brain-usage reminder every 10 tool calls
#
# No model, no effort, no otel — those come from the base profile.
