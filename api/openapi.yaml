openapi: 3.1.0
info:
  title: agentibrain-kernel HTTP API
  version: 0.1.0
  description: |
    Canonical HTTP contract for the agentibrain kernel. Consumed by:

    - `agentihooks` hooks (brain_adapter → /feed, brain_writer_hook → /marker,
      amygdala_hook → /signal).
    - KB MCP tools (`kb_search`, `kb_brief`, `kb_dispatch`).
    - Humans + other agents for ingest and retrieval.

    **Auth:** bearer token via `Authorization: Bearer $KB_ROUTER_TOKEN`. The
    token is issued at `agentibrain install` time and stored in `~/.agentibrain/.env`.

    **Status:** v0.1.0 ships `/health`, `/ingest`, `/search`, `/brief`,
    `/dispatch`. The fleet-facing endpoints (`/feed`, `/signal`, `/marker`,
    `/tick`) land in Phase 7 when the agentihooks connectors are rewritten.

servers:
  - url: http://localhost:8102
    description: Default local brain-api port (agentibrain install default).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  schemas:
    HealthResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        version:
          type: string
        services:
          type: object
          additionalProperties: { type: string }

    IngestRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Free-form message; router classifies and fans out.
        repository:
          type: string
          default: ""
          description: Explicit repository URL to clone and ingest. Repository references in message text never authorize cloning.
        title:
          type: string
        tags:
          type: array
          items: { type: string }

    IngestResponse:
      type: object
      properties:
        obsidian_ref:
          type: string
          nullable: true
        ingest_batch:
          type: string
        artifacts:
          type: array
          items: { type: object }

    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        limit: { type: integer, default: 10 }
        include_artifact: { type: boolean, default: true }
        include_obsidian:  { type: boolean, default: true }
        min_score: { type: number, default: 0.0 }

    SearchHit:
      type: object
      properties:
        source: { type: string }
        ref: { type: string }
        title: { type: string }
        score: { type: number }
        preview: { type: string }
        metadata: { type: object }

    SearchResponse:
      type: object
      properties:
        hits:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }

    MarkerRequest:
      type: object
      required: [type, content]
      properties:
        type:
          type: string
          enum: [lesson, milestone, signal, decision]
        content: { type: string }
        severity:
          type: string
          enum: [nuclear, critical, warning, info, resolved]
        source: { type: string }
        attrs:
          type: object
          additionalProperties: true
          properties:
            project_id:
              type: string
              description: Canonical project, host/owner/repo; checked against a worker token's grant.
            scope:
              type: string
              description: >-
                Kept as provenance. On a signal, the value fleet shares it with
                every project: the next tick serves it in each project feed's
                fleet_warnings.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Liveness probe.
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /health/deep:
    get:
      summary: >-
        Deep readiness probe. Round-trips a vault write, delegates to the
        embeddings service's own deep check (DB + live embedding call + schema
        dimension match), and verifies the inference gateway accepts the
        configured key. Returns status "ok" or "degraded" with a per-dependency
        checks map.
      responses:
        "200":
          description: Aggregated readiness with per-dependency detail.
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  service:
                    type: string
                  checks:
                    type: object
                    additionalProperties: true

  /health/pipeline:
    get:
      summary: >-
        Pipeline readiness. Answers a different question from /health/deep:
        not "can dependencies be reached" but "is data flowing through the
        loop" — ingest, tick drain, arc ranking, lesson reconcile and feed,
        signal broadcast, feed injection, and index coverage per producer.
        Cheap: bounded vault globs plus one grouped count from the embeddings
        service. No embedding or completion call, so it is safe to poll.
        A stage with no input reports ok — an unused brain is healthy.
      responses:
        "200":
          description: Per-stage verdicts, each carrying the evidence behind it.
          content:
            application/json:
              schema:
                type: object
                required: [status, stages]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded, broken]
                  service:
                    type: string
                  vault_root:
                    type: string
                  checked_at:
                    type: string
                    format: date-time
                  stages:
                    type: object
                    description: >-
                      Keyed by stage name (ingest, drain, arcs, lessons,
                      signals, feed, index). Each value carries `status`
                      (ok | warn | fail), stage-specific evidence fields, and
                      a `hint` naming the next action when not ok.
                    additionalProperties:
                      type: object
                      required: [status]
                      properties:
                        status:
                          type: string
                          enum: [ok, warn, fail]
                        hint:
                          type: string
                      additionalProperties: true

  /ingest:
    post:
      summary: Classify + fan-out an ingest payload.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/IngestRequest" }
      responses:
        "200":
          description: Ingest summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResponse" }

  /search:
    post:
      summary: Federated search across artifact-store + vault.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: Ranked hits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }

  /brief:
    post:
      summary: LLM-synthesized digest of search hits (3-5 sentences + candidate refs).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: Brief.
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  brief: { type: string }
                  candidate_refs:
                    type: array
                    items: { type: string }

  /dispatch:
    post:
      summary: Assemble bundle + submit generation job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_engine, target_job_type, source_refs]
              properties:
                target_engine: { type: string }
                target_job_type: { type: string }
                source_refs:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Dispatch receipt.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  bundle_id: { type: string }

  /feed:
    get:
      summary: Hot arcs + operator intent for SessionStart injection (Phase 7).
      description: >
        Without project, the unscoped legacy feed, served to router tokens and
        ungranted worker tokens only. With project, that canonical project's own
        ranked arcs, current lessons and decisions, signals, inferred intent and
        explicitly shared fleet warnings; a project with no data returns empty
        lists, never global memory. A worker token granted other projects gets
        403 and the denial is recorded.
      parameters:
        - name: project
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        "200":
          description: Fleet feed snapshot, or one project's feed when project is given.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      hot_arcs:
                        type: array
                        items: { type: object }
                      inject_blocks:
                        type: array
                        items: { type: object }
                  - type: object
                    required: [scope, project_id, revision, freshness, metrics]
                    properties:
                      scope: { type: string, enum: [project] }
                      project_id: { type: string }
                      brain_id: { type: string }
                      revision: { type: string }
                      freshness:
                        type: object
                        properties:
                          state: { type: string, enum: [fresh, stale, missing] }
                          generated_at:
                            type: string
                            nullable: true
                            description: When the current revision was first produced.
                          checked_at:
                            type: string
                            nullable: true
                            description: When a tick last confirmed the revision; age and state count from here.
                          age_seconds: { type: integer, nullable: true }
                      arcs: { type: array, items: { type: object } }
                      lessons: { type: array, items: { type: object } }
                      decisions: { type: array, items: { type: object } }
                      signals: { type: array, items: { type: object } }
                      fleet_warnings: { type: array, items: { type: object } }
                      intent:
                        type: object
                        nullable: true
                        properties:
                          text: { type: string }
                          label: { type: string, enum: [inferred] }
                          state: { type: string, enum: [fresh, stale] }
                          inferred_at: { type: string }
                      metrics:
                        type: object
                        properties:
                          project_feed_cross_scope_failures: { type: integer }
        "400":
          description: A project scoped worker token called without project.
        "403":
          description: The project is outside the worker token's grant.

  /denials:
    get:
      summary: Cross scope query denials, served to router tokens only.
      description: >
        A worker token (KB_WORKER_TOKENS, brain_id=token) naming a brain other than
        BRAIN_ID is refused with 403, and the denial is recorded here.
      parameters:
        - name: since_ms
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Denials at or after since_ms.
          content:
            application/json:
              schema:
                type: object
                properties:
                  brain_id: { type: string }
                  denials:
                    type: array
                    items:
                      type: object
                      properties:
                        denial_id: { type: string }
                        at_ms: { type: integer }
                        requester_scope: { type: string }
                        target_brain: { type: string }
                        session_title: { type: string }
                        query: { type: string }
        "401":
          description: Missing or unknown bearer.
        "403":
          description: The bearer is not a router token.

  /signal:
    get:
      summary: SSE stream of emergency signals (Phase 7).
      responses:
        "200":
          description: SSE stream.
          content:
            text/event-stream:
              schema: { type: string }

  /marker:
    post:
      summary: Record a lesson / milestone / signal / decision marker (Phase 7).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkerRequest" }
      responses:
        "202":
          description: Marker accepted.

  /graph/entity:
    post:
      summary: Create or revise a typed graph entity (arc, session, lesson, decision, evidence).
      description: >
        Active only when BRAIN_GRAPH_DB is set; otherwise 404. The id is
        `<type>:<key>`. A revision older than, or different at the same number
        from, the stored one is refused with 409. A worker token may only write
        entities inside its project grant (403).
      responses:
        "201":
          description: Entity stored; action is created, updated or replayed.
        "403":
          description: Entity project is outside the caller grant.
        "409":
          description: A newer or different revision is stored.
        "422":
          description: Invalid entity; detail.reason names the rule.

  /graph/entity/{entity_id}:
    get:
      summary: An entity with its typed relations, limited to entities the caller may read.
      description: >
        Outgoing edges carry the relation type as name; incoming edges carry
        its inverse name (has_lesson / lesson_of, derived_from / source_of,
        applies_decision / decision_applied_by, supported_by / supports).
      parameters:
        - { name: entity_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: entity and relations.
        "404":
          description: Unknown, outside the caller scope, or graph inactive.

  /graph/relation:
    post:
      summary: Store a directed typed relation with status, confidence class and evidence.
      description: >
        An inverse name is stored as its canonical edge, so an inverse pair is
        one edge. An unknown endpoint, unknown type or incompatible endpoint
        type is rejected and counted in graph_invalid_relations_total. Each
        relation carries a positive revision (default 1); a revision older than,
        or different at the same number from, the stored edge is a 409.
      parameters:
        - { name: quarantine, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "201":
          description: Relation stored; action is created, updated or replayed.
        "202":
          description: Invalid relation held in quarantine (quarantine=true).
        "409":
          description: A newer or different revision of this relation is stored.
        "422":
          description: Invalid relation; detail.reason and graph_invalid_relations_total.

  /graph/stats:
    get:
      summary: graph_invalid_relations_total by reason and quarantine size (router tokens only).
      responses:
        "200":
          description: Counts.

  /graph/expand:
    post:
      summary: Expand authenticated scoped semantic seeds through accepted graph relations.
      description: |
        SV2-GRF-03. Seed ids come from semantic or lexical retrieval and are
        reauthorized here from the bearer grant. Project further narrows that
        grant. Unknown and forbidden seeds both return 404. Canonical relation
        types are derived_from, has_lesson, applies_decision and supported_by;
        incoming edges preserve their canonical direction in each evidence path.
        BRAIN_GRAPH_EXPANSION defaults to false; disabled expansion returns only
        authorized seeds. No canonical entity or relation is modified.

        Each read uses indexed pages of at most 16 neighbors, a consistent
        SQLite read transaction and a deadline that also interrupts SQL and
        bounds lock acquisition. Node and edge budgets apply across all resumes.
        A timeout returns collected nodes and an opaque single use continuation,
        bound to actor, current grant, project, graph revision and process.
        A timeout before snapshot validation returns no cached nodes. Disabling
        expansion suppresses expanded neighbors on every response, including
        timed out resumptions, and preserves the timeout status when applicable.
        Continue with continuation and the same project. At most three resumes
        are permitted within the original 60 seconds. The cache holds at most
        128 requests; eviction, restart, expiry or graph changes require a new
        scoped request. No continuation is issued for depth, node or edge caps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                seed_ids: { type: array, maxItems: 16, items: { type: string } }
                project: { type: string, maxLength: 256, default: "" }
                relation_types:
                  type: array
                  maxItems: 16
                  items: { type: string, enum: [derived_from, has_lesson, applies_decision, supported_by] }
                max_depth: { type: integer, minimum: 0, maximum: 4, default: 2 }
                max_nodes: { type: integer, minimum: 1, maximum: 100, default: 50 }
                max_edges: { type: integer, minimum: 1, maximum: 1000, default: 500 }
                time_budget_ms: { type: integer, minimum: 1, maximum: 500, default: 100 }
                continuation: { type: [string, "null"], maxLength: 128 }
      responses:
        "200":
          description: |
            nodes contains authorized entity id, type, revision, projects,
            vault_ref, title, inclusion explanation and path. Each path entry
            names relation_id, source, type, target, traversal direction, from,
            to, revision and confidence. partial identifies omissions; reason is
            null, disabled, timeout, depth_cap, node_cap or edge_cap.
            continuation is null or the opaque resume token;
            continuation_expires_in_seconds reports its maximum lifetime;
            remaining_continuations bounds further resumes.
            graph_nodes_expanded_per_request counts newly included nodes in
            this response; edges_examined counts cumulative inspected edges.
        "401":
          description: Invalid authentication.
        "403":
          description: Caller belongs to another brain.
        "404":
          description: Seed not found in the caller scope.
        "409":
          description: Continuation unavailable or graph changed; restart scoped seeds.
        "422":
          description: Invalid request, relation type or budget.
        "503":
          description: Graph projection is not configured.

  /tick:
    post:
      summary: Trigger a manual cognitive tick (operator / cron).
      responses:
        "202":
          description: Tick queued.

  /knowledge/detail:
    post:
      summary: Publish immutable canonical knowledge sections (SV2-GRF-05).
      security: [{bearerAuth: []}]
      description: |
        Router authority required. Publish the graph entity at the matching
        revision first. This additive store contains authoritative full text,
        never an indexed preview. Existing vault and indexed documents require
        explicit canonical publication; no preview fallback or invented history.
        A retry of identical content is replayed; a different body at the same
        revision is refused. Graph rebuilds must preserve this authoritative table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entity_id, revision, sections]
              properties:
                entity_id: {type: string, minLength: 3, maxLength: 256}
                revision: {type: integer, minimum: 1}
                sections:
                  type: array
                  minItems: 1
                  maxItems: 256
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, content]
                    properties:
                      id: {type: string, minLength: 1, maxLength: 256}
                      content: {type: string, maxLength: 2000000}
                references:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    additionalProperties: false
                    required: [entity_id, revision, kind]
                    properties:
                      entity_id: {type: string, minLength: 3, maxLength: 256}
                      revision: {type: integer, minimum: 1}
                      kind: {enum: [lesson, source_range]}
                      start: {type: integer, minimum: 0}
                      end: {type: integer, minimum: 1}
      responses:
        "201":
          description: |
            Created or replayed immutable revision. content_hash is SHA256 of
            UTF-8 JSON of the normalized publication (defaults included, nulls
            excluded), sorted keys, ensure_ascii=false and default JSON separators.
            Section ids are unique. Total section content is at most 8 million bytes.
            Lesson references name lesson entities; source ranges name evidence
            entities and use increasing zero-based half-open Unicode character
            offsets in the concatenation of their full sections.
        "403": {description: Router authority required.}
        "409": {description: Conflicting revision or matching graph metadata absent.}
        "422": {description: Invalid publication or preview-only payload.}
        "404": {description: Graph storage is not configured.}
    get:
      summary: Read complete canonical sections and paginated provenance.
      security: [{bearerAuth: []}]
      parameters:
        - {name: entity_id, in: query, required: true, schema: {type: string, minLength: 3, maxLength: 256}}
        - {name: revision, in: query, schema: {type: integer, minimum: 1}}
        - {name: section, in: query, schema: {type: string, default: "", maxLength: 256}}
        - {name: section_offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: section_limit, in: query, schema: {type: integer, minimum: 1, maximum: 64, default: 16}}
        - {name: reference_offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: reference_limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: content_hash, in: query, schema: {type: string, default: "", maxLength: 64}}
      responses:
        "200":
          description: |
            entity_id, revision, content_hash, total_bytes, trust_class, provenance,
            sections, selected_section, total_sections, complete,
            next_section_offset, references, next_reference_offset and
            knowledge_reference_resolution_failures. Each section includes its
            exact content and SHA256 content_hash. Complete refers to the selected
            body; provenance pagination has its own next_reference_offset.
            Continue with the returned revision and hash, the same selected section
            and explicit offsets. A revision is mandatory after offset zero.
            Reads check both current and historical project authorization.
            Missing or restricted references are redacted as unavailable;
            missing detail and out-of-bounds ranges are explicitly labelled.
            A reference resolves through this endpoint with its entity id, revision
            and hash; source ranges refer to original evidence, while lessons and
            arcs are synthesized knowledge. Existing graph neighborhoods use
            POST /graph/expand and its bounded continuation contract.
        "404": {description: Revision or section unavailable in caller scope or graph unconfigured.}
        "409": {description: Expected content hash does not match.}
        "422": {description: Invalid pagination or continuation without revision.}
        "503":
          description: |
            Full reads disabled by BRAIN_FULL_DETAIL=false.
            Rollback retains published revisions and the truthful MCP preview tool.

  /knowledge/neighbors:
    get:
      summary: Page the authorized current graph neighborhood with a keyset.
      security: [{bearerAuth: []}]
      parameters:
        - {name: entity_id, in: query, required: true, schema: {type: string, minLength: 3, maxLength: 256}}
        - {name: after, in: query, schema: {type: string, default: "", maxLength: 256}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        "200":
          description: |
            entity_id, view=current_graph, relations and next_after. Relations
            are ordered by immutable relation id. Continue on the same entity
            with next_after until null. Each request rechecks current grants for
            both endpoints. Hidden neighbors are omitted and do not consume the
            visible page. This is a live graph view, not historical guidance or a
            repeatable snapshot; newly inserted relations before the keyset require
            a fresh scan. Full entity sections use the separate pinned detail API.
        "404": {description: Entity unavailable in caller scope or graph unconfigured.}
        "422": {description: Invalid page bound.}
