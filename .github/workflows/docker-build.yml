name: docker-build

on:
  push:
    branches: [dev]
    paths:
      - "services/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [dev]
    paths:
      - "services/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]') && 'anton-oss' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - brain-api
          - embeddings
          - brain-ops
          - mcp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=pr-${{ github.event.number || github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: |
            ghcr.io/the-cloud-clockwork/agentibrain-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Amygdala check of the built image against a live signal store
        if: matrix.service == 'brain-ops'
        env:
          NET: amygdala-check-${{ github.run_id }}-${{ github.run_attempt }}
          STORE: amygdala-redis-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker network create "$NET"
          docker run -d --rm --name "$STORE" --network "$NET" redis:7-alpine
          for _ in $(seq 30); do docker exec "$STORE" redis-cli ping | grep -q PONG && break; sleep 1; done
          docker exec "$STORE" redis-cli -n 11 XADD events:health '*' severity warning title image-check event brain.test
          docker run --rm --network "$NET" \
            ghcr.io/the-cloud-clockwork/agentibrain-brain-ops:${{ steps.tag.outputs.tag }} \
            /app/amygdala.py --redis-url "redis://$STORE:6379/11" --vault /tmp/vault \
            --brain-feed /tmp/vault/brain-feed --dry-run | tee amygdala.json
          python3 -c "import json; r = json.load(open('amygdala.json')); assert 'error' not in r and r['events_read'] >= 1 and r['signals_detected'] >= 1, r"

      - name: Remove the amygdala check signal store
        if: always() && matrix.service == 'brain-ops'
        env:
          NET: amygdala-check-${{ github.run_id }}-${{ github.run_attempt }}
          STORE: amygdala-redis-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker rm -f "$STORE" || true
          docker network rm "$NET" || true

      - name: Set up Python
        if: matrix.service == 'mcp'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Transport authentication of the built image
        if: matrix.service == 'mcp'
        run: |
          python -m pip install pytest
          python -m pytest -v services/mcp/image_tests \
            --mcp-image=ghcr.io/the-cloud-clockwork/agentibrain-mcp:${{ steps.tag.outputs.tag }}

      - name: Push
        if: steps.tag.outputs.push == 'true'
        # Only the floating tag is published (per no-hash-pins rule). Rollback
        # is `git revert` on dev, which republishes :dev.
        run: docker push ghcr.io/the-cloud-clockwork/agentibrain-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
