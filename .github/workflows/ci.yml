name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  merge_group:
    types: [checks_requested]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]') && 'anton-oss-light' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install linter
        run: |
          python -m venv "$RUNNER_TEMP/runner-trust-venv"
          "$RUNNER_TEMP/runner-trust-venv/bin/python" -m pip install 'ruff>=0.5' 'PyYAML>=6.0'
          echo "$RUNNER_TEMP/runner-trust-venv/bin" >> "$GITHUB_PATH"
      - name: Check out protected runner trust gate
        uses: actions/checkout@v4
        with:
          repository: the-cloud-clockwork/agentihooks
          ref: dev
          path: .runner-trust
          persist-credentials: false
      - name: Require trusted actors before private runner admission
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/runner-trust"
          mkdir -p "$root/.github/workflows"
          cp -R .github/workflows/. "$root/.github/workflows/"
          cp .runner-trust/.github/workflows/trusted-actors.json "$root/.github/workflows/"
          python -I .runner-trust/scripts/ci_runner_trust.py --root "$root"
      - name: Ruff lint
        run: python -m ruff check agentibrain tests scripts
      - name: Ruff format check
        run: python -m ruff format --check agentibrain tests scripts

  lint-test:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]') && 'anton-oss' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
          POSTGRES_DB: brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brain -d brain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable) + dev extras
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install -e '.[dev]'

      - name: Import smoke
        run: python -c "import agentibrain; print(agentibrain.__version__)"

      - name: CLI smoke
        run: |
          agentibrain --version
          agentibrain version

      - name: Pytest
        run: python -m pytest -q tests/unit

      - name: Pytest (brain-ops service)
        run: python -m pytest -q services/brain-ops/tests

      - uses: azure/setup-helm@v4

      # Neither of these two ran in CI, so both suites had rotted unnoticed —
      # the marker and ranking regressions this repo just fixed had no gate.
      - name: Pytest (mcp service)
        run: |
          pip install -r services/mcp/requirements.txt
          python -m pytest -q services/mcp/tests

      - name: Pytest (brain-api service)
        run: |
          pip install -r services/brain-api/requirements.txt
          python -m pytest -q services/brain-api/tests

      - name: Pytest (embeddings service)
        env:
          # Pure target_dim + /health/deep tests always run; the DB-backed
          # reconcile tests use this DSN and skip if it is unreachable.
          EMBED_TEST_POSTGRES_URL: postgresql://brain:brain@localhost:5432/brain
        run: |
          pip install -r services/embeddings/requirements.txt
          python -m pytest -q services/embeddings/tests

      # Runs both brain-ops CronJob scripts as the chart renders them against
      # live brain-api and embeddings processes on the pgvector service: a
      # completed tick must serve text and semantic reads, an index failure
      # must never complete. Needs the brain-api and embeddings requirements
      # installed above and helm.
      - name: Pytest (tick cycle end to end)
        env:
          TICK_CYCLE_POSTGRES_URL: postgresql://brain:brain@localhost:5432/brain
        run: python -m pytest -q tests/test_tick_cycle*.py

      # Invalid escapes only surface on a FRESH compile, so bytecode caching
      # hides them locally while the container warns on every pod start. This
      # token-stream check is cache- and Python-version-independent.
      - name: Invalid escape sequences (brain-ops)
        run: python services/brain-ops/check_escapes.py services/brain-ops

  macos-smoke:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (editable) + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Import smoke
        run: python -c "import agentibrain; print(agentibrain.__version__)"

      - name: Pytest
        run: python -m pytest -q tests/unit

      - name: Pytest (brain-ops service)
        run: python -m pytest -q services/brain-ops/tests

  gate-required:
    name: Gate — Required
    if: always()
    needs: [lint, lint-test, macos-smoke]
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]') && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          EVENT: ${{ github.event_name }}
          MACOS: ${{ needs.macos-smoke.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "event=$EVENT results=$RESULTS"
          if [[ "$EVENT" != pull_request && "$MACOS" == skipped ]]; then RESULTS="${RESULTS/skipped/success}"; fi
          for result in $RESULTS; do [[ "$result" == success ]] || exit 1; done
