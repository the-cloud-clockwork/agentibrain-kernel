{{- if .Values.tickDrain.enabled }}
# Tick queue consumer. The brain-api /tick endpoint enqueues tick requests as
# JSON files under {vault}/brain-feed/ticks/requested/. This CronJob drains
# them on a short cadence through tick_cycle.py drain, the same maintenance
# and index pipeline the scheduled tick runs. A request moves to
# ticks/completed/ only after brain_tick, embed_arcs and embed_raw succeed;
# an index failure keeps it queued for retry, resuming at indexing, until
# tickDrain.indexMaxAttempts, then moves it to ticks/failed/. Idempotent:
# exits immediately when the queue is empty.
#
# Concurrency: Forbid — never overlap with itself. Forbid applies only within
# this CronJob's own lineage, not against the scheduled brain-ops tick.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Chart.Name }}-tick-drain
spec:
  schedule: {{ .Values.tickDrain.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.tickDrain.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.tickDrain.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.tickDrain.activeDeadlineSeconds | default 300 }}
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tick-drain
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # Force NFS attribute cache refresh — freshly mounted NFS caches stale dir listings
                  sleep 5
                  ls /vault/brain-feed/ticks/requested/ > /dev/null 2>&1 || true
                  exec python3 /app/tick_cycle.py drain --vault /vault
              # Full env map, matching the main brain-cron container, so a
              # drain-triggered brain_tick.py runs with the SAME tuning
              # (BRAIN_DECAY_*, BRAIN_PROMOTE_HEAT, EMBEDDINGS_URL, ...) as the
              # scheduled tick — on-demand and scheduled ticks stay identical.
              env:
                - name: TICK_INDEX_MAX_ATTEMPTS
                  value: {{ .Values.tickDrain.indexMaxAttempts | default 10 | quote }}
                {{- range $key, $value := .Values.env }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
              {{- if or .Values.secretRef .Values.additionalSecretRefs }}
              envFrom:
                {{- if .Values.secretRef }}
                - secretRef:
                    name: {{ .Values.secretRef }}
                {{- end }}
                {{- range .Values.additionalSecretRefs }}
                - secretRef:
                    name: {{ . }}
                {{- end }}
              {{- end }}
              resources:
                {{- toYaml (.Values.tickDrain.resources | default .Values.resources) | nindent 16 }}
              volumeMounts:
                {{- if and .Values.nfsVault .Values.nfsVault.server }}
                - name: nfs-vault
                  mountPath: /vault
                {{- else if .Values.vaultPVC }}
                - name: vault
                  mountPath: /vault
                {{- end }}
          volumes:
            {{- if and .Values.nfsVault .Values.nfsVault.server }}
            - name: nfs-vault
              nfs:
                server: {{ .Values.nfsVault.server }}
                path: {{ .Values.nfsVault.path }}
            {{- else if .Values.vaultPVC }}
            - name: vault
              persistentVolumeClaim:
                claimName: {{ .Values.vaultPVC }}
            {{- end }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- range . }}
            - name: {{ . }}
            {{- end }}
          {{- end }}
{{- end }}
